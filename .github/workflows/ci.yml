name: Production CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-validate:
    name: Lint & Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Helm Lint
        run: |
          set -euo pipefail
          for chart in helm/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              echo "Linting Helm chart in ${chart}..."
              helm lint "${chart}"
            fi
          done

      - name: Terraform Format Check
        run: |
          set -euo pipefail
          if [ -d "terraform" ]; then
            echo "Checking Terraform formatting..."
            terraform fmt -check -recursive terraform/
          fi

  python-test:
    name: Python 3.12 Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov httpx

      - name: Run Pytest with Coverage
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

  container-security:
    name: Docker Build & Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Inference Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/serving/Dockerfile
          push: false
          load: true
          tags: k8s-mlops-platform/model-serving:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: k8s-mlops-platform/model-serving:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
